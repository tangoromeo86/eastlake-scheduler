<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Team — Eastlake League Scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="team-title">My Team</h1>
    <div class="header-actions">
      <a href="guide.html" class="btn btn-secondary">? Guide</a>
      <a href="./" class="btn btn-secondary">&#8592; Schedule</a>
      <a href="logout" class="btn btn-secondary">Sign out</a>
    </div>
  </header>

  <div id="my-team-page" class="page-wrap narrow">
    <div id="pending-email-note" class="field-form-error hidden" style="background:#fef3c7;border-color:#f59e0b;color:#92400e"></div>

    <div class="field-editor-form">
      <div class="field-form-inner" id="mte-form">
        <div class="field-form-row">
          <label>Team Name *<input id="mte-label" type="text" placeholder="e.g. Wildcats U10"></label>
        </div>
        <div class="field-form-row">
          <label>Coach Name<input id="mte-coach" type="text" placeholder="e.g. Jane Smith"></label>
          <label>Home Field<select id="mte-field"><option value="">— None yet —</option></select></label>
        </div>
        <div class="field-form-row">
          <label>Coach Email<input id="mte-email" type="email" inputmode="email" autocomplete="email" spellcheck="false" placeholder="jane@example.com"></label>
          <label>Coach Phone<input id="mte-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 555-5555"></label>
          <label>Games this season <span class="field-form-hint">(blank = league default)</span><input id="mte-target" type="number" min="1" max="20"></label>
        </div>
        <div class="field-form-row">
          <label>First available day <span class="field-form-hint">(blank = whole season — your director sets this if your team starts later than everyone else)</span><input id="mte-earliest" type="date"></label>
        </div>
        <h3 style="margin-top:20px">Weekly Availability</h3>
        <p class="field-form-hint" style="margin-bottom:10px">When can this team play? Fields left blank default to "Available for both."</p>
        <div id="mte-availability"></div>
        <div class="field-form-actions">
          <button id="mte-save" class="btn btn-primary">Save Changes</button>
        </div>
        <div id="mte-error" class="field-form-error hidden"></div>
        <div id="mte-success" class="field-form-ok hidden"></div>
      </div>
    </div>

    <div class="field-editor-form section-gap">
      <div class="field-form-inner">
        <h3>Availability Calendar</h3>
        <p class="field-form-hint" style="margin-bottom:0">How your saved availability above looks across the season.</p>
      </div>
      <div id="mte-avail-cal" class="av-cal-wrapper"></div>
    </div>

    <h3 class="section-gap">Upcoming Games</h3>
    <div id="games-list"></div>
  </div>

  <script src="availability-editor.js"></script>
  <script src="ui.js"></script>
  <script src="my-team.js"></script>
</body>
</html>
